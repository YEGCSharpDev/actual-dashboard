name: CI/CD Build and Test

on:
  push:
    branches: [ "main", "lean-node-migration" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root and frontend dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Run unit tests
        run: |
          npm test

      - name: Build frontend and backend
        run: |
          npm run build
