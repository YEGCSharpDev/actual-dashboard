name: tests

on:
  push:
    branches: [ main, actual-cli-integration ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci
          
      - name: Import smoke test
        run: |
          PYTHONPATH=. python -c "import data, transforms"
          # app.py runs streamlit code at import; skip direct import smoke

      - name: Run tests
        run: |
          PYTHONPATH=. pytest --cov=. --cov-fail-under=80 tests/
          node actual-helper.js --test-connection
          node actual-helper.js --smoke-init
